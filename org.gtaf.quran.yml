id: org.gtaf.quran
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: qm_flutter
rename-icon: quran
rename-desktop-file: quran.desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --socket=pulseaudio
  - --device=dri

  - --own-name=org.mpris.MediaPlayer2.mpv.*
  - --talk-name=org.gnome.SessionManager

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: libaacs
    disabled: true
    config-opts:
      - --disable-static
      - --disable-bdjava-jar
    sources:
      - sha256: a88aa0ebe4c98a77f7aeffd92ab3ef64ac548c6b822e8248a8b926725bea0a39
        type: archive
        url: https://download.videolan.org/pub/videolan/libaacs/0.11.1/libaacs-0.11.1.tar.bz2
        x-checker-data:
          type: html
          url: https://www.videolan.org/developers/libaacs.html
          version-pattern: Latest release is <b>libaacs (\d\.\d+\.?\d*)</b>
          url-template: https://download.videolan.org/pub/videolan/libaacs/$version/libaacs-$version.tar.bz2

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4
        commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84
        x-checker-data:
          type: git

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        # If the main server is down, you can use the following repository
        # url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
    post-install:
      - mv /app/bin/mpv /app/bin/mpv-bin
      - install -D mpv /app/bin/mpv
    cleanup:
      - /share/applications
      - /share/bash-completion
      - /share/doc
      - /share/fish
      - /share/zsh
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: mpv

  - name: qm_flutter
    buildsystem: simple
    build-commands:
      - cp -r data/quran /app/
      - chmod +x /app/quran/qm_flutter
      - mkdir -p /app/bin
      - ln -s /app/quran/qm_flutter /app/bin/qm_flutter
      - install -Dm644 data/gui/quran.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 data/gui/quran.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata/
    cleanup:
      - /quran/.DS_Store
      - /quran/._.DS_Store
      - /quran/._data
    sources:
      - type: archive
        dest: data
        url: https://direct-download-apps.s3.us-east-2.amazonaws.com/quran/quran_0.5.11_x86_64.tar.gz
        sha256: 2dea85c6b7ec1f95405a9c9724008be759d8688124aa332e459927d41752d68b
        only-arches:
          - x86_64
      - type: archive
        dest: data
        url: https://direct-download-apps.s3.us-east-2.amazonaws.com/quran/quran_0.5.9_arm64.tar.gz
        sha256: d690a161d3e919392a4f1c1ef15d715395ed3010d01c4328bc6775fb0f34e4b9
        only-arches:
          - aarch64
      - type: file
        path: org.gtaf.quran.appdata.xml
